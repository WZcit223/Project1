[project]
name = "industrial-ai"
version = "0.1.0.dev0"
description = "Industrial AI Application Framework Prototype: synthetic data, simulation and scenario-based decision support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

# uv workspace: scenario packs are separate packages (ADR-004). The framework has no runtime
# dependency on them; the dev group installs the warehouse pack for tests and local runs only.
[tool.uv.workspace]
members = ["scenarios/warehouse"]

[tool.uv.sources]
industrial-ai-warehouse = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/ contains illustrative interface sketches (pseudocode), not runnable code
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["industrial_ai", "industrial_ai_warehouse"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["industrial_ai", "industrial_ai_warehouse"]
mypy_path = ["src", "scenarios/warehouse/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "industrial-ai-warehouse",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
