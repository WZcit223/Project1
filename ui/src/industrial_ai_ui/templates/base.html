<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Industrial AI{% endblock %} · Industrial AI prototype</title>
  <link rel="stylesheet" href="{{ url_for('static', path='ui.css') }}">
  <script src="{{ url_for('static', path='vendor/htmx-2.0.4.min.js') }}" defer></script>
</head>
<body>
  <header>
    <strong>Industrial AI · Inventory scenarios</strong>
    <nav>
      <a href="{{ url_for('overview') }}">Overview</a>
      <a href="{{ url_for('data') }}">Data</a>
      <a href="{{ url_for('synthetic') }}">Synthetic data</a>
      <a href="{{ url_for('scenarios') }}">Scenario builder</a>
      <a href="{{ url_for('simulate') }}">Simulation</a>
      <a href="{{ url_for('runs') }}">Results</a>
    </nav>
    <span class="badge">{{ messages.HONESTY_BADGE }}</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="muted">{{ messages.HONESTY_NOTE }}</footer>
</body>
</html>
